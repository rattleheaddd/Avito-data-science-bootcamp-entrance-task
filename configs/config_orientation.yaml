coord_output: false
mask_output: false
glyph_coord_output: false
glyph_mask_output: false

vertical: false

# JPEG quality — немного артефактов,
# но без жесткого разрушения изображения
quality: [55, 95]

visibility_check: true

# Иногда дополнительный текст на фоне
midground: 0.10

midground_offset:
  percents: [[-0.3, 0.3], [-0.3, 0.3]]

foreground_mask_pad: 3


# =========================================================
# TEXT CORPUS
# =========================================================

corpus:
  weights: [1, 0]

  args:

    # LengthAugmentableCorpus
    - paths:
        - resources/corpus/mjsynth.txt
        - resources/corpus/synthtext.txt

      weights: [1, 1]

      min_length: 2
      max_length: 20

      textcase:
        - lower
        - upper
        - capitalize

      augmentation: 0.05
      augmentation_length: [2, 20]

    # CharAugmentableCorpus — не используем
    - paths: []
      weights: []

      min_length: 2
      max_length: 20

      textcase:
        - lower
        - upper
        - capitalize

      augmentation: 0

      augmentation_charset:
        resources/charset/alphanum_special.txt


# =========================================================
# FONT
# =========================================================

font:
  paths:
    - resources/font

  weights: [1]

  size: [36, 72]

  bold: 0.4


# =========================================================
# TEXTURE / BACKGROUND
# =========================================================

texture:
  prob: 0.60

  args:
    paths:
      - resources/image

    weights: [1]

    alpha: [0, 1]
    grayscale: 0
    crop: 1


# =========================================================
# COLORS
# =========================================================

colormap2:
  paths:
    - resources/colormap/iiit5k_gray.txt

  weights: [1]

  k: 2
  alpha: [1, 1]
  colorize: 1


colormap3:
  paths:
    - resources/colormap/iiit5k_gray.txt

  weights: [1]

  k: 3
  alpha: [1, 1]
  colorize: 1


color:
  gray: [0, 255]
  alpha: [1, 1]
  colorize: 1


# =========================================================
# CHARACTER SHAPE
# =========================================================

shape:
  prob: 0.25

  args:
    weights: [1, 1]

    args:

      # немного elastic distortion
      - alpha: [4, 10]
        sigma: [4, 8]

      - alpha: [0, 1]
        sigma: [0, 0.4]


# =========================================================
# LAYOUT
# =========================================================

# Только обычный горизонтальный flow.
# Curved text нам сейчас почти не нужен.
layout:
  weights: [1, 0]

  args:

    - space: [-1, 4]
      line_align: [middle]

    - curve: [10, 20]
      space: [-1, 4]
      convex: 0.5
      upward: 0.5


# =========================================================
# TEXT STYLE
# =========================================================

style:
  prob: 0.15

  args:
    weights: [2, 2, 1]

    args:

      # border
      - size: [1, 4]
        alpha: [1, 1]
        grayscale: 0

      # shadow
      - distance: [1, 4]
        angle: [0, 360]
        alpha: [0.3, 0.6]
        grayscale: 0

      # extrusion
      - length: [1, 4]
        angle: [0, 360]
        alpha: [1, 1]
        grayscale: 0


# =========================================================
# GEOMETRY
# =========================================================

transform:
  prob: 0.60

  args:
    weights: [1, 1, 1, 1, 1, 1, 3]

    args:

      # mild perspective x
      - percents: [[0.85, 1], [1, 1]]
        aligns: [[0, 0], [0, 0]]

      # mild perspective y
      - percents: [[1, 1], [0.85, 1]]
        aligns: [[0, 0], [0, 0]]

      # trapezoid x
      - weights: [1, 0, 1, 0]
        percent: [0.90, 1]
        align: [-1, 1]

      # trapezoid y
      - weights: [0, 1, 0, 1]
        percent: [0.90, 1]
        align: [-1, 1]

      # skew x
      - weights: [1, 0]
        angle: [0, 8]
        ccw: 0.5

      # skew y
      - weights: [0, 1]
        angle: [0, 5]
        ccw: 0.5

      # rotation
      - angle: [0, 8]
        ccw: 0.5


# =========================================================
# PADDING
# =========================================================

pad:
  prob: 1

  args:
    pxs:
      - [2, 10]
      - [2, 10]
      - [2, 10]
      - [2, 10]


# =========================================================
# IMAGE DEGRADATION
# =========================================================

postprocess:
  args:

    # Gaussian noise
    - prob: 0.3

      args:
        scale: [1, 5]
        per_channel: 0

    # Gaussian blur
    - prob: 0.55

      args:
        sigma: [0.2, 1.5]

    # downsample/upscale degradation
    - prob: 0.40

      args:
        size: [0.4, 1.0]

    # median blur фактически отключён
    - prob: 0

      args:
        k: [1, 1]